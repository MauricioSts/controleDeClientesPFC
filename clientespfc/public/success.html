<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assinatura Confirmada! - JerseysAndBits</title>
  <script type="module">
    // Configuração do Firebase
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js';
    import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDj7WHl4YQJ7m8j4L6RB7I7zq8c6FKzH6FY",
      authDomain: "pfcsports-ce4f6.firebaseapp.com",
      projectId: "pfcsports-ce4f6",
      storageBucket: "pfcsports-ce4f6.appspot.com",
      messagingSenderId: "1084649781309",
      appId: "1:1084649781309:web:c4f5d7a1e7f2c6e8a9b0c1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Função para criar requisição de upgrade
    async function createUpgradeRequest(email) {
      try {
        console.log('📧 Email para upgrade:', email);
        
        // Criar documento na coleção pending_upgrades
        await addDoc(collection(db, 'pending_upgrades'), {
          email: email,
          status: 'pending',
          plan: 'pro',
          createdAt: serverTimestamp(),
          processed: false
        });
        
        console.log('✅ Requisição criada com sucesso!');
        
        // Mostrar mensagem de sucesso
        const container = document.querySelector('.container');
        if (container) {
          const p = document.createElement('p');
          p.style.color = '#14B8A6';
          p.style.fontWeight = 'bold';
          p.textContent = '✅ Solicitação enviada! Em breve você terá acesso PRO.';
          container.insertBefore(p, container.querySelector('button'));
        }
      } catch (error) {
        console.error('❌ Erro ao criar requisição:', error);
      }
    }

    // Executar quando a página carregar
    window.addEventListener('DOMContentLoaded', async () => {
      const userEmail = sessionStorage.getItem('pendingUpgradeEmail');
      console.log('🔍 SessionStorage check:', userEmail);
      
      if (userEmail) {
        await createUpgradeRequest(userEmail);
        sessionStorage.removeItem('pendingUpgradeEmail');
      } else {
        console.warn('⚠️ Nenhum email encontrado no sessionStorage');
        
        // Tentar pegar da URL ou prompt
        const urlParams = new URLSearchParams(window.location.search);
        const emailFromUrl = urlParams.get('email');
        
        if (emailFromUrl) {
          await createUpgradeRequest(emailFromUrl);
        }
      }
    });
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 50px;
      background: rgba(30, 41, 59, 0.95);
      border-radius: 24px;
      border: 2px solid #3B82F6;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .success-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: bounce 1s;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-30px); }
      60% { transform: translateY(-15px); }
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #3B82F6 0%, #14B8A6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 32px;
      opacity: 0.9;
    }
    button {
      background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon">✅</div>
    <h1>Assinatura Confirmada!</h1>
    <p>Seja bem-vindo ao plano PRO!</p>
    <p style="font-size: 0.9rem; opacity: 0.8;">
      Você agora tem acesso a todos os recursos exclusivos.
    </p>
    <button onclick="window.location.href='/'">
      Voltar para o App
    </button>
  </div>
</body>
</html>
