<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assinatura Confirmada! - JerseysAndBits</title>
  <script>
    // Função para criar requisição de upgrade via API
    async function createUpgradeRequest(email) {
      try {
        console.log('📧 Enviando requisição para:', email);
        
        const response = await fetch('/api/create-upgrade', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email })
        });

        const data = await response.json();
        
        if (response.ok) {
          console.log('✅ Requisição criada com sucesso!', data);
          
          // Mostrar mensagem de sucesso
          const container = document.querySelector('.container');
          if (container) {
            const successMsg = container.querySelector('.success-msg');
            if (successMsg) {
              successMsg.style.display = 'block';
            }
          }
        } else {
          console.error('❌ Erro na API:', data);
          
          // Mostrar mensagem de erro
          const container = document.querySelector('.container');
          if (container) {
            const errorMsg = container.querySelector('.error-msg');
            if (errorMsg) {
              errorMsg.style.display = 'block';
            }
          }
        }
      } catch (error) {
        console.error('❌ Erro ao criar requisição:', error);
        
        // Mostrar mensagem de erro
        const container = document.querySelector('.container');
        if (container) {
          const errorMsg = container.querySelector('.error-msg');
          if (errorMsg) {
            errorMsg.style.display = 'block';
          }
        }
      }
    }

    // Executar quando a página carregar
    window.addEventListener('DOMContentLoaded', async () => {
      console.log('🔄 Página de sucesso carregada');
      
      // Buscar email do sessionStorage
      const userEmail = sessionStorage.getItem('pendingUpgradeEmail');
      console.log('🔍 Email encontrado:', userEmail);
      
      if (userEmail) {
        await createUpgradeRequest(userEmail);
        sessionStorage.removeItem('pendingUpgradeEmail');
      } else {
        console.warn('⚠️ Nenhum email encontrado no sessionStorage');
        
        // Tentar pegar da URL
        const urlParams = new URLSearchParams(window.location.search);
        const emailFromUrl = urlParams.get('email');
        
        if (emailFromUrl) {
          console.log('📧 Email encontrado na URL:', emailFromUrl);
          await createUpgradeRequest(emailFromUrl);
        } else {
          console.warn('⚠️ Nenhum email disponível');
          
          const container = document.querySelector('.container');
          if (container) {
            const errorMsg = container.querySelector('.error-msg');
            if (errorMsg) {
              errorMsg.style.display = 'block';
            }
          }
        }
      }
    });
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 50px;
      background: rgba(30, 41, 59, 0.95);
      border-radius: 24px;
      border: 2px solid #3B82F6;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .success-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: bounce 1s;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-30px); }
      60% { transform: translateY(-15px); }
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #3B82F6 0%, #14B8A6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 32px;
      opacity: 0.9;
    }
    button {
      background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    .success-msg, .error-msg {
      display: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      margin-top: 20px;
    }
    .success-msg {
      background: rgba(20, 184, 166, 0.2);
      color: #14B8A6;
      border: 2px solid #14B8A6;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 2px solid #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon">✅</div>
    <h1>Assinatura Confirmada!</h1>
    <p>Seja bem-vindo ao plano PRO!</p>
    <p style="font-size: 0.9rem; opacity: 0.8;">
      Você agora tem acesso a todos os recursos exclusivos.
    </p>
    <div class="success-msg">
      ✅ Solicitação enviada! Em breve você terá acesso PRO.
    </div>
    <div class="error-msg">
      ⚠️ Entre em contato com o suporte para ativar seu acesso PRO.
    </div>
    <button onclick="window.location.href='/'">
      Voltar para o App
    </button>
  </div>
</body>
</html>
